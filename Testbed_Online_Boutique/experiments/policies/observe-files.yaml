apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: boutique-file-read
  namespace: boutique
spec:
  kprobes:
    - call: security_file_permission
      syscall: false
      return: true
      args:
        - index: 0
          type: file
        - index: 1
          type: int
      returnArg:
        index: 0
        type: int
      selectors:
        - matchArgs:
            - index: 0
              operator: Equal
              values:
                - /tmp/gd4-fixture/token
            - index: 1
              operator: Equal
              values: ["4"]
