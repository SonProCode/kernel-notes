apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique
resources:
  - upstream-v0.10.7.yaml
patches:
  - target:
      kind: Deployment
      name: "^(frontend|checkoutservice|cartservice|redis-cart|adservice|loadgenerator)$"
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {lab.slot: w1}
  - target:
      kind: Deployment
      name: "^(paymentservice|shippingservice|emailservice|currencyservice|productcatalogservice|recommendationservice)$"
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {lab.slot: w2}
  - target:
      kind: Deployment
      name: loadgenerator
    patch: |-
      - op: add
        path: /spec/replicas
        value: 0
  - target:
      kind: Service
      name: frontend-external
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend-external

