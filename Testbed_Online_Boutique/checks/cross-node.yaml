apiVersion: v1
kind: Namespace
metadata:
  name: policy-lab
---
apiVersion: v1
kind: Pod
metadata:
  name: lab-http
  namespace: policy-lab
  labels:
    app: lab-http
spec:
  nodeSelector: {lab.slot: w2}
  automountServiceAccountToken: false
  containers:
    - name: http
      image: busybox:1.36.1
      command: ["/bin/sh", "-c"]
      args: ["mkdir -p /www && echo boutique-network-ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
      readinessProbe:
        httpGet: {path: /, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: lab-http
  namespace: policy-lab
spec:
  selector: {app: lab-http}
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: allowed
  namespace: policy-lab
  labels:
    lab-client: allowed
spec:
  nodeSelector: {lab.slot: w1}
  automountServiceAccountToken: false
  containers:
    - name: client
      image: busybox:1.36.1
      command: ["sleep", "86400"]
---
apiVersion: v1
kind: Pod
metadata:
  name: blocked
  namespace: policy-lab
  labels:
    lab-client: blocked
spec:
  nodeSelector: {lab.slot: w1}
  automountServiceAccountToken: false
  containers:
    - name: client
      image: busybox:1.36.1
      command: ["sleep", "86400"]

